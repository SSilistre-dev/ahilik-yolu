<!doctype html>
<html lang="tr">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">

      "./src/sfx.js": "./src/sfx.js?v=2",
      "./src/assets.js": "./src/assets.js?v=2"
    }
  }
  </script>
</head>
<body>
