<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ahilik Yolu">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2b1d12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
  <title>Ahilik Yolu – Ahlakın Yolu</title>
  <link rel="stylesheet" href="style.css?v=16">
  <style>
    html, body { overscroll-behavior: none; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    /* three.js CDN'den gelene kadar boş ekran yerine */
    #ui:empty::before { content: 'Yükleniyor…'; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #2b1d12; color: #f3e3c3; font: 600 20px system-ui, sans-serif; }
    #old { display: none; position: fixed; inset: 0; z-index: 10000; align-items: center; justify-content: center; padding: 24px; background: #2b1d12; color: #fff; font: 600 20px/1.4 system-ui, sans-serif; text-align: center; }
    #mute:not(.ay-round) { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 8px; width: 44px; height: 44px; z-index: 50; border: 0; border-radius: 50%; background: rgba(43,29,18,.75); color: #fff; font-size: 20px; line-height: 1; cursor: pointer; }
    #fatal { position: fixed; inset: 0; z-index: 10001; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px); background: #2b1d12; color: #f3e3c3; font: 500 18px/1.45 system-ui, sans-serif; text-align: center; overflow: auto; }
    #fatal h1 { margin: 0; font-size: 26px; }
    #fatal p { margin: 0; max-width: 28em; }
    #fatal button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #e8b04a; color: #2b1d12; font: 700 18px system-ui, sans-serif; cursor: pointer; }
    #fatal details { max-width: 90vw; font-size: 13px; opacity: .8; }
    #fatal pre { white-space: pre-wrap; word-break: break-word; text-align: left; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 9999; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #2b1d12; color: #fff; font: 600 20px system-ui, sans-serif; text-align: center; }
    #rotate b { font-size: 56px; }
    @media (orientation: landscape) and (max-height: 500px) { #rotate { display: flex; } }
  </style>
  <script>
    // importmap: iOS 16.4+ / Chrome 89+. Eskisinde boş sayfa yerine mesaj.
    if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')))
      document.write('<style>#old{display:flex!important}</style>');
    // iOS Safari pinch-zoom (viewport user-scalable=no yok sayılır).
    document.addEventListener('gesturestart', (e) => e.preventDefault());
  </script>
  <!-- Bump v on every release: modules are mapped to versioned URLs so stale browser caches are bypassed. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "./src/main.js": "./src/main.js?v=16",
      "./src/path.js": "./src/path.js?v=16",
      "./src/data.js": "./src/data.js?v=16",
      "./src/game.js": "./src/game.js?v=16",
      "./src/bot.js": "./src/bot.js?v=16",
      "./src/botstep.js": "./src/botstep.js?v=16",
      "./src/scene.js": "./src/scene.js?v=16",
      "./src/ui.js": "./src/ui.js?v=16",
      "./src/tutorial.js": "./src/tutorial.js?v=16",
      "./src/sfx.js": "./src/sfx.js?v=16",
      "./src/assets.js": "./src/assets.js?v=16",
      "./src/store.js": "./src/store.js?v=16",
      "./src/view.js": "./src/view.js?v=16",
      "./src/pwa.js": "./src/pwa.js?v=16",
      "./src/router.js": "./src/router.js?v=16"
    }
  }
  </script>
</head>
<body>
  <div id="old" role="alert">Tarayıcın çok eski. Lütfen iOS 16.4+ / güncel Chrome kullan.</div>
  <div id="stage"><canvas id="board"></canvas></div>
  <div id="ui"></div>
  <button id="mute" type="button" aria-label="Sesi aç/kapat">🔊</button>
  <div id="rotate" role="alert"><b>📱</b>Telefonu dik tut</div>
  <!-- Inline import so the importmap applies and main.js gets the versioned URL (a plain src= bypasses the importmap). -->
  <script>
    // Açılış hatası (ağ/CDN/WebGL): sonsuz "Yükleniyor…" yerine anlaşılır ekran. Dinamik import() importmap'i kullanır.
    window.__ahiFatal = function (title, msg, err) {
      if (document.getElementById('fatal')) return;
      var d = document.createElement('div'), h = document.createElement('h1'), p = document.createElement('p'),
          b = document.createElement('button'), det = document.createElement('details'), sm = document.createElement('summary'), pre = document.createElement('pre');
      d.id = 'fatal'; d.setAttribute('role', 'alert');
      h.textContent = title; p.textContent = msg;
      b.type = 'button'; b.textContent = 'Yeniden Dene'; b.onclick = function () { location.reload(); };
      sm.textContent = 'Teknik ayrıntı'; pre.textContent = String((err && err.message) || err || '');
      det.append(sm, pre); d.append(h, p, b, det); document.body.append(d);
    };
    function bootError(err) {
      var c = document.createElement('canvas'), gl = false;
      try { gl = !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) {}
      window.__ahiFatal('Oyun açılamadı', gl
        ? 'Oyun dosyaları yüklenemedi. İnternete bağlı mısın? Bağlantını kontrol edip tekrar dene.'
        : 'Bu cihazda 3 boyutlu grafik çalışmıyor. Başka bir tarayıcı dene (Chrome ya da Safari).', err);
    }
    import('./src/main.js').catch(bootError);
  </script>
</body>
</html>
