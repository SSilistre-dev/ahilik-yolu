<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UI önizleme</title><link rel="stylesheet" href="../style.css">
<style>html,body{margin:0;height:100%;background:linear-gradient(135deg,#8a9a6a,#5d6e8a)}
#dev{position:fixed;left:4px;top:42%;z-index:100;font:12px system-ui;max-width:60vw}#dev summary{background:#000a;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;width:max-content}
#dev div{display:flex;gap:4px;flex-wrap:wrap;background:#000b;padding:6px;border-radius:8px;margin-top:4px}#dev button{min-height:44px;font-size:12px}#ov{position:fixed;inset:0}</style></head>
<body><div id="ov"></div><details id="dev"><summary>dev</summary><div></div></details>
<script type="module">
import { createUI } from '../src/ui.js';
const ui = createUI(document.getElementById('ov'), {
  onAction: a => console.log('onAction', JSON.stringify(a)),
  onTileHighlight: t => console.log('onTileHighlight', JSON.stringify(t)) });
window.ui = ui;
const load = async n => (await fetch(`../fixtures/${n}.json`)).json();
const ev = [{ type: 'ahlak', card: 'ahlak-comert-0', text: 'Sen olumlu ahlak kartı açtı: Cömert. Açık karelere rozet konuyor.' }, { type: 'move', text: 'Bot 1 Disiplinli karesine ilerledi.' }, { type: 'trade', card: 'ticaret-ankara-4', pIdx: 0, city: 'ankara', value: 2, text: 'Sen Ankara ticaretini tamamladı (2M).' }];
const evq = [ev[1]];
const sc = [{ pIdx: 2, money: 6, badges: 11, mult: 3, total: 18, rank: 1 }, { pIdx: 0, money: 5, badges: 6, mult: 2, total: 10, rank: 2 }, { pIdx: 1, money: 0, badges: 3, mult: 1, total: 0, rank: 3 }, { pIdx: 3, money: 0, badges: 0, mult: 1, total: 0, rank: 4 }];
const midLegal = [
  { type: 'move', card: 'yol-comert-1', tile: 12 }, { type: 'move', card: 'yol-comert-1', tile: 5 },
  { type: 'move', card: 'yol-adaletli-2', tile: 8 }, { type: 'move', card: 'yol-durust-2', tile: 8 },
  { type: 'move', card: 'yol-ahievran-1', tile: 0 }, { type: 'kargo', card: 'yol-kargo-1', city: 'ankara' }, { type: 'kargo', card: 'yol-kargo-1', city: 'konya' },
  { type: 'trade', withPlayer: 1, give: 'yol-comert-1', want: 'durust' }, { type: 'trade', withPlayer: 1, give: 'yol-comert-1', want: 'bilgili' },
  { type: 'trade', withPlayer: 2, give: 'yol-adaletli-2', want: 'bilgili' }, { type: 'openRoad', tile: 8 },
  { type: 'pass' }, { type: 'endTurn' }, { type: 'readText' }];
const sets = {
  start: async () => [await load('start'), [{ type: 'drawAhlak' }], []],
  'mid (bot aktif)': async () => [await load('mid'), midLegal.filter(a => ['move', 'endTurn', 'readText'].includes(a.type)), evq],
  'mid (sen aktif)': async () => { const s = await load('mid'); s.active = 0; s.players[0].pendingText = 'yol-comert-0'; s.players[0].hand.push('yol-kargo-1', 'yol-ahievran-1', 'yol-comert-0');
    s.tiles[8].closed = true; return [s, midLegal, evq]; },
  'sen (okuma yok)': async () => { const s = await load('mid'); s.active = 0; s.players[0].hand.push('yol-kargo-1', 'yol-comert-0'); s.tiles[8].closed = true; return [s, midLegal.filter(a => a.type !== 'readText'), evq]; },
  'close fazi': async () => { const s = await load('mid'); s.active = 0; s.phase = 'close'; return [s, [{ type: 'closeTile', tile: 6 }, { type: 'closeTile', tile: 11 }], [{ type: 'ahlak', card: 'ahlak-comert-neg', text: 'Olumsuz: Cimri! Bir Cömert kareyi kapat.' }]]; },
  over: async () => { const s = await load('over'); s.__score = sc; return [s, [], []]; },
};
const dev = document.querySelector('#dev div');
for (const [k, f] of Object.entries(sets)) {
  const b = document.createElement('button'); b.textContent = k;
  b.onclick = async () => ui.render(...await f()); dev.append(b);
}
const sb = document.createElement('button'); sb.textContent = 'start screen';
sb.onclick = () => ui.showStart(c => console.log('onStart', JSON.stringify(c)));
dev.append(sb);
const mk = (t, f) => { const b = document.createElement('button'); b.textContent = t; b.onclick = f; dev.append(b); };
const cur = async () => { const s = await sets['sen (okuma yok)'](); ui.render(s[0], s[1], []); return s; };
mk('ahlak +', async () => { const s = await cur(); ui.render(s[0], s[1], [ev[0]]); });
mk('ahlak −', async () => { const s = await cur(); ui.render(s[0], s[1], [{ type: 'ahlak', card: 'ahlak-adaletli-neg', text: 'Sen olumsuz ahlak kartı açtı: Haksız. Bir Adaletli kare kapatılmalı.' }]); });
mk('flyCoins', () => ui.flyCoins({ x: innerWidth / 2, y: innerHeight / 2 }, 1, 4));
mk('trade fly', async () => { const s = await cur(); ui.render(s[0], s[1], [ev[2]]); });
mk('loading', () => { let p = 0; const t = setInterval(() => { p += .08; ui.setLoading(p); if (p >= 1) clearInterval(t); }, 150); });
sets['mid (sen aktif)']().then(a => ui.render(a[0], a[1], []));
</script></body></html>
